worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;  # Możesz zmienić na swoją domenę

        root /usr/share/nginx/html;  # Ścieżka do zbudowanej aplikacji Angular
        index index.html;

        # Zapewnienie poprawnej obsługi SPA (Single Page Application)
        location / {
            try_files $uri $uri/ /index.html;  # Jeśli plik nie istnieje, przekieruj na index.html
        }
    }
}
